services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PORT: 3001
      MAX_INVOICES_PER_EXPORT: 50
      LEADS_FILE_PATH: backend/data/leads.jsonl
    volumes:
      - backend_data:/app/backend/data
    expose:
      - "3001"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
