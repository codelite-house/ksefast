apiVersion: v1
kind: Service
metadata:
  name: {{ include "ksefast.app.fullname" . }}
  labels:
    {{- include "ksefast.labels" . | nindent 4 }}
    {{- include "ksefast.app.selectorLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.app.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "ksefast.app.selectorLabels" . | nindent 4 }}
