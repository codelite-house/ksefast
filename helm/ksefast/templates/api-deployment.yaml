apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ksefast.api.fullname" . }}
  labels:
    {{- include "ksefast.labels" . | nindent 4 }}
    {{- include "ksefast.api.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "ksefast.api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ksefast.api.selectorLabels" . | nindent 8 }}
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.port }}
              protocol: TCP
          {{- if or .Values.api.env .Values.api.envValueFrom }}
          env:
            {{- range $name, $value := .Values.api.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range .Values.api.envValueFrom }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretKeyRef.name | quote }}
                  key: {{ .secretKeyRef.key | quote }}
                  {{- if hasKey .secretKeyRef "optional" }}
                  optional: {{ .secretKeyRef.optional }}
                  {{- end }}
            {{- end }}
          {{- end }}
          {{- with .Values.api.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.api.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.api.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
