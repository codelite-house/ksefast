apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ksefast.app.fullname" . }}
  labels:
    {{- include "ksefast.labels" . | nindent 4 }}
    {{- include "ksefast.app.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.app.replicaCount }}
  selector:
    matchLabels:
      {{- include "ksefast.app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ksefast.app.selectorLabels" . | nindent 8 }}
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: app
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.app.service.port }}
              protocol: TCP
          env:
            # nginx w obrazie app proxuje /api/ pod ten adres (szablon nginx.conf, envsubst).
            - name: BACKEND_HOST
              value: {{ include "ksefast.api.fullname" . | quote }}
            - name: BACKEND_PORT
              value: {{ .Values.api.service.port | quote }}
            {{- range $name, $value := .Values.app.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          {{- with .Values.app.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.app.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.app.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
