name: Build, Test, Release, Deploy
run-name: "Build #${{ github.run_number }} – ${{ github.ref_name }}"

on:
  push:
    branches:
      - main
      - "feature/**"

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    outputs:
      new_version: ${{ steps.bump_version.outputs.new_version }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Bump version
        id: bump_version
        run: |
          VERSION_FILE=VERSION
          if [ ! -f "$VERSION_FILE" ]; then echo "0.0.0" > $VERSION_FILE; fi
          OLD_VERSION=$(cat $VERSION_FILE)
          if [[ $GITHUB_REF == refs/heads/main ]]; then
            NEW_VERSION=$(echo $OLD_VERSION | awk -F. -v OFS=. '{$3++;print}')
          else
            BRANCH=$(echo $GITHUB_REF | sed 's|refs/heads/||')
            NEW_VERSION=$(echo $OLD_VERSION | awk -F. -v OFS=. '{$3++;print}')-$BRANCH
          fi
          echo $NEW_VERSION > $VERSION_FILE
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
      - name: Commit version bump
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add VERSION
          git commit -m "ci: bump version to ${{ steps.bump_version.outputs.new_version }}" || echo "No changes to commit"
          git push || echo "No changes to push"
      - name: Update run name with version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method PATCH \
            /repos/${{ github.repository }}/actions/runs/${{ github.run_id }} \
            -f "display_title=Build ${{ steps.bump_version.outputs.new_version }} (#${{ github.run_number }}) – ${{ github.ref_name }}"

  build-test-push:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.new_version }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend image
        run: |
          docker build -f Dockerfile.backend -t ghcr.io/${{ github.repository }}-backend:${VERSION} .
          docker push ghcr.io/${{ github.repository }}-backend:${VERSION}
      - name: Build and push frontend image
        run: |
          docker build -f frontend/Dockerfile -t ghcr.io/${{ github.repository }}-frontend:${VERSION} frontend/
          docker push ghcr.io/${{ github.repository }}-frontend:${VERSION}
      - name: Run tests (frontend)
        run: |
          cd frontend && npm ci && npm run test --if-present
      - name: Run tests (backend)
        run: |
          cd server && npm ci && npm run test --if-present

  helm-release:
    needs: build-test-push
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.new_version }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Package backend chart
        run: |
          helm package helm/ksefast-backend --version ${VERSION} --app-version ${VERSION} -d helm/repo
      - name: Package frontend chart
        run: |
          helm package helm/ksefast-frontend --version ${VERSION} --app-version ${VERSION} -d helm/repo
      - name: Publish Helm charts to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: helm/repo

  infra-update:
    needs: helm-release
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.new_version }}
    steps:
      - name: Checkout infrastructure repo
        uses: actions/checkout@v4
        with:
          repository: codelitehouse/infrastructure
          ssh-key: ${{ secrets.INFRA_SSH_KEY }}
      - name: Update app.yaml revisionVersion
        run: |
          if [[ $GITHUB_REF == refs/heads/main ]]; then
            ENV=production
          else
            ENV=staging
          fi
          APP_PATH=apps/$ENV/ksefast-frontend/app.yaml
          sed -i "s/revisionVersion:.*/revisionVersion: ${VERSION}/" $APP_PATH
      - name: Commit and push infra changes
        run: |
          git config user.name "automat@codelitehouse.com"
          git config user.email "automat@codelitehouse.com"
          git add .
          git commit -m "ci: update ksefast-frontend revisionVersion to ${VERSION} [auto]" || echo "No changes to commit"
          git push
      - name: Add entry to updates.log
        run: |
          echo "${{ github.event.head_commit.timestamp }}: Pipeline updated ksefast-frontend to ${VERSION}" >> updates.log
          git add updates.log
          git commit -m "ci: log update for ksefast-frontend ${VERSION}" || echo "No changes to commit"
          git push
      - name: Tag release
        run: |
          git tag ${VERSION}
          git push origin ${VERSION}
