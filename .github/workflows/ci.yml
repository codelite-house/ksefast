name: Build, Test, Release, Deploy
run-name: "Build #${{ github.run_number }} – ${{ github.ref_name }}"

on:
  push:
    branches:
      - main
      - "feature/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      new_version: ${{ steps.bump_version.outputs.new_version }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump version
        id: bump_version
        run: |
          git fetch --tags
          LATEST_TAG=$(git tag --sort=-version:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
          if [ -z "$LATEST_TAG" ]; then LATEST_TAG="0.0.0"; fi
          if [[ $GITHUB_REF == refs/heads/main ]]; then
            NEW_VERSION=$(echo $LATEST_TAG | awk -F. -v OFS=. '{$3++;print}')
          else
            BRANCH=$(echo $GITHUB_REF | sed 's|refs/heads/||' | sed 's|/|-|g')
            NEW_VERSION=$(echo $LATEST_TAG | awk -F. -v OFS=. '{$3++;print}')-$BRANCH
          fi
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
      - name: Print version to summary
        run: |
          echo "## Version: \`${{ steps.bump_version.outputs.new_version }}\`" >> $GITHUB_STEP_SUMMARY

  build-test-push:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.new_version }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend image
        run: |
          docker build -f Dockerfile.backend -t ghcr.io/${{ github.repository }}-backend:${VERSION} .
          docker push ghcr.io/${{ github.repository }}-backend:${VERSION}
      - name: Build and push frontend image
        run: |
          docker build -f frontend/Dockerfile -t ghcr.io/${{ github.repository }}-frontend:${VERSION} frontend/
          docker push ghcr.io/${{ github.repository }}-frontend:${VERSION}
      - name: Run tests (frontend)
        run: |
          cd frontend && npm ci && npm run test --if-present
      - name: Run tests (backend)
        run: |
          cd server && npm ci && npm run test --if-present

  helm-release:
    needs: [build-test-push, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.new_version }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Log in to GHCR (Helm OCI)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username ${{ github.actor }} --password-stdin
      - name: Package and push backend chart
        run: |
          helm package helm/ksefast-backend --version ${VERSION} --app-version ${VERSION}
          helm push ksefast-backend-${VERSION}.tgz oci://ghcr.io/codelite-house/helm
      - name: Package and push frontend chart
        run: |
          helm package helm/ksefast-frontend --version ${VERSION} --app-version ${VERSION}
          helm push ksefast-frontend-${VERSION}.tgz oci://ghcr.io/codelite-house/helm

  notify-infra:
    needs: [helm-release, version]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.new_version }}
    steps:
      - name: Trigger infrastructure deploy
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.INFRA_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/${{ secrets.INFRA_REPO }}/dispatches \
            -d "{\"event_type\":\"ksefast-deploy\",\"client_payload\":{\"version\":\"${VERSION}\",\"sha\":\"${{ github.sha }}\"}}")
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          echo "HTTP status: ${HTTP_STATUS}"
          [ -n "$BODY" ] && echo "Response body: ${BODY}"
          [ "$HTTP_STATUS" = "204" ] || { echo "Dispatch failed"; exit 1; }

  tag-release:
    needs: [notify-infra, helm-release, version]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.new_version }}
    steps:
      - name: Checkout ksefast repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag release in ksefast repo
        run: |
          git tag ${VERSION}
          git push origin ${VERSION}

  notify-discord:
    name: Notify Discord on failure
    runs-on: ubuntu-latest
    needs: [version, build-test-push, helm-release, notify-infra, tag-release]
    if: failure()
    steps:
      - name: Discord notification
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: "❌ Build failed: **${{ github.workflow }}** [#${{ github.run_number }}] in `${{ github.repository }}` on `${{ github.ref_name }}` — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
