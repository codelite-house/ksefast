name: Build, Test, Release, Deploy
run-name: "Build #${{ github.run_number }} – ${{ github.ref_name }}"

on:
  push:
    branches:
      - main
      - "feature/**"

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      new_version: ${{ steps.bump_version.outputs.new_version }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump version
        id: bump_version
        run: |
          git fetch --tags
          LATEST_TAG=$(git tag --sort=-version:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
          if [ -z "$LATEST_TAG" ]; then LATEST_TAG="0.0.0"; fi
          if [[ $GITHUB_REF == refs/heads/main ]]; then
            NEW_VERSION=$(echo $LATEST_TAG | awk -F. -v OFS=. '{$3++;print}')
          else
            BRANCH=$(echo $GITHUB_REF | sed 's|refs/heads/||' | sed 's|/|-|g')
            NEW_VERSION=$(echo $LATEST_TAG | awk -F. -v OFS=. '{$3++;print}')-$BRANCH
          fi
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
      - name: Print version to summary
        run: |
          echo "## Version: \`${{ steps.bump_version.outputs.new_version }}\`" >> $GITHUB_STEP_SUMMARY

  build-test-push:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.new_version }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend image
        run: |
          docker build -f Dockerfile.backend -t ghcr.io/${{ github.repository }}-backend:${VERSION} .
          docker push ghcr.io/${{ github.repository }}-backend:${VERSION}
      - name: Build and push frontend image
        run: |
          docker build -f frontend/Dockerfile -t ghcr.io/${{ github.repository }}-frontend:${VERSION} frontend/
          docker push ghcr.io/${{ github.repository }}-frontend:${VERSION}
      - name: Run tests (frontend)
        run: |
          cd frontend && npm ci && npm run test --if-present
      - name: Run tests (backend)
        run: |
          cd server && npm ci && npm run test --if-present

  helm-release:
    needs: [build-test-push, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.new_version }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Log in to GHCR (Helm OCI)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username ${{ github.actor }} --password-stdin
      - name: Package and push backend chart
        run: |
          helm package helm/ksefast-backend --version ${VERSION} --app-version ${VERSION}
          helm push ksefast-backend-${VERSION}.tgz oci://ghcr.io/codelite-house/helm
      - name: Package and push frontend chart
        run: |
          helm package helm/ksefast-frontend --version ${VERSION} --app-version ${VERSION}
          helm push ksefast-frontend-${VERSION}.tgz oci://ghcr.io/codelite-house/helm

  tag-release:
    needs: [infra-update, version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.new_version }}
    steps:
      - name: Checkout ksefast repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag release in ksefast repo
        run: |
          git tag ${VERSION}
          git push origin ${VERSION}

  infra-update:
    needs: [helm-release, version]
    runs-on: ubuntu-latest
    # This job requires INFRA_PAT secret (access to the private infrastructure repo).
    # It is skipped automatically in forks where the secret is not available.
    if: ${{ secrets.INFRA_PAT != '' }}
    env:
      VERSION: ${{ needs.version.outputs.new_version }}
    steps:
      - name: Checkout infrastructure repo
        uses: actions/checkout@v4
        with:
          repository: codelite-house/infrastructure
          token: ${{ secrets.INFRA_PAT }}
      - name: Update app.yaml chartVersion
        run: |
          set -euo pipefail
          if [[ $GITHUB_REF == refs/heads/main ]]; then
            DEPLOY_ENV=production
          else
            DEPLOY_ENV=staging
          fi
          echo "Deploy env: $DEPLOY_ENV, version: ${VERSION}"
          grep -n "chartVersion" apps/$DEPLOY_ENV/ksefast-frontend/app.yaml || echo "WARNING: chartVersion not found in frontend app.yaml"
          grep -n "chartVersion" apps/$DEPLOY_ENV/ksefast-backend/app.yaml  || echo "WARNING: chartVersion not found in backend app.yaml"
          sed -i "s/chartVersion:.*/chartVersion: \"${VERSION}\"/" apps/$DEPLOY_ENV/ksefast-frontend/app.yaml
          sed -i "s/chartVersion:.*/chartVersion: \"${VERSION}\"/" apps/$DEPLOY_ENV/ksefast-backend/app.yaml
          git config user.name "automat@codelitehouse.com"
          git config user.email "automat@codelitehouse.com"
          git diff --stat
          git add .
          git commit -m "ci: update ksefast-frontend and ksefast-backend chartVersion to ${VERSION} [auto]" || echo "No changes to commit"
          git push
      - name: Add entry to updates.log
        run: |
          set -euo pipefail
          echo "${{ github.event.head_commit.timestamp }}: Pipeline updated ksefast-frontend and ksefast-backend to ${VERSION}" >> updates.log
          git add updates.log
          git commit -m "ci: log update for ksefast ${VERSION}" || echo "No changes to commit"
          git push
